# Human-reviewed bootstrap template. Install as .github/workflows/verify.yml
# after the LinkedIn repository import. Agents cannot publish workflow changes.
name: LinkedIn verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: agentwork-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare isolated Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r app/requirements.txt
      - name: App tests (mock provider)
        run: .venv/bin/python -B -m unittest discover -s tests -v
      - name: Acceptance evals (offline)
        run: .venv/bin/python -B -m unittest discover -s evals -v
